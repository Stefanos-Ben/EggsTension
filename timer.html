<html>
    <head>
        <link rel="stylesheet" href="timer.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <body>
        <div id="selection-view">
            <img class="eggif" src="images/EggStention-001.gif" alt="Amimated egg" />
            <h1 class="pixelify-sans">EggStension Egg Timer!</h1>
            <button id="softBtn" class="btn">Soft Boiled</button>
            <button id="jammyBtn" class="btn">Jammy</button>
            <button id="mediumBtn" class="btn">Medium</button>
            <button id="hardBtn" class="btn">Hard Boiled</button>
        </div>
        <div id="timer-view" class="hidden">
            <h1 id="time">00:00</h1>
            <button id="resetBtn" class="button">Reset</button>
        </div>
        

        <script src="timer.js"></script>
    </body>
</html>
